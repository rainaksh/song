    <div id="root"></div>
    <script>
      (function () {
        if (typeof window === 'undefined') return;
        var hasRawEntry = !!document.querySelector('script[src="/src/main.tsx"]');
        if (!hasRawEntry || window.__SWARA_MOUNTED__ || window.location.pathname.indexOf('/docs') !== -1) return;
        function goDocs() {
          var p = window.location.pathname.replace(/\/index\.html$/, '/');
          var base = p.endsWith('/') ? p : p + '/';
          window.location.replace(base + 'docs/' + window.location.search + window.location.hash);
        }
        if (window.location.hostname.endsWith('github.io')) {
          goDocs();
          return;
        }
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (!window.__SWARA_MOUNTED__) {
              fetch('./docs/index.html', { method: 'HEAD' }).then(function (r) {
                if (r.ok) goDocs();
              }).catch(function () {});
            }
          }, 800);
        });
      })();
    </script>
